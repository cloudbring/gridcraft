# Standalone workspace (not a member of the gridcraft workspace): re-measure harness for
# artcraft-algorithms#192 claim "gridcraft conditional formats 2x" (#114).
[workspace]

[package]
name = "perf-remeasure"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
# NEW: branch algo/114-cf-rule-cache, 48d4b6ac, by path.
gridcraft-engine = { path = "../../crates/engine" }
gridcraft-xlsx = { path = "../../crates/xlsx" }
gridcraft-model = { path = "../../crates/model" }
gridcraft-core = { path = "../../crates/core" }
# OLD: merge-base with origin/main, renamed git dependencies (same source id as engine's own deps, so they unify).
gridcraft-engine-old = { package = "gridcraft-engine", git = "https://github.com/storytold/gridcraft", rev = "85e51e009c24fad47575f04d3c08f12342615d82" }
gridcraft-xlsx-old = { package = "gridcraft-xlsx", git = "https://github.com/storytold/gridcraft", rev = "85e51e009c24fad47575f04d3c08f12342615d82" }
gridcraft-model-old = { package = "gridcraft-model", git = "https://github.com/storytold/gridcraft", rev = "85e51e009c24fad47575f04d3c08f12342615d82" }
gridcraft-core-old = { package = "gridcraft-core", git = "https://github.com/storytold/gridcraft", rev = "85e51e009c24fad47575f04d3c08f12342615d82" }
# Paired harness, craft-libs algo/integration, ticket #189.
craft-bench = { git = "https://github.com/cloudbring/craft-libs", rev = "94c6d76e5bc2c936d3db5ce5e19d70213e8390c0" }
serde_json = "1"

[profile.release]
debug = false
